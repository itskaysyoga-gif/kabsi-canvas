# Ops 1 part A (R-66, master plan 19.3), changed by Ops 1 part B (master plan 25.1).
# npm: security updates only. open-pull-requests-limit 0 turns off version-update pull requests, and Dependabot security
# updates (a repository setting) still open theirs. A security pull request merges only on green CI. Dependabot reads the
# committed package-lock.json.
# github-actions: every action in .github/workflows is pinned to a full commit SHA with the version in a comment
# (scripts/check-repo.mjs fails CI on a tag). Dependabot moves the pins: one weekly pull request with all the action
# updates grouped, so a pin is never left to go stale. Dependabot branches never build on Vercel (vercel.json).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
