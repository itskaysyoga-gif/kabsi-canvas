# Ops 1 part A (R-66, master plan 19.3). Security updates only: open-pull-requests-limit 0 turns off version-update
# pull requests, and Dependabot security updates (a repository setting) still open theirs. A security pull request
# merges only on green CI. Dependabot branches never build on Vercel (vercel.json).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
