name: Deploy

# D304: a push to main deploys what changed. Secrets (GitHub, Settings, Secrets and variables, Actions):
#   SUPABASE_ACCESS_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Migrations are NOT applied here: earlier migrations were applied by hand with their own version stamps, so a blind
# `db push` would replay them. Apply migrations through the Supabase connector (or add them to history first).

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "supabase/functions-removed.txt"
      - "workers/kabsi-go/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ynjdqjlmdwjgbfezevxy

jobs:
  functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pinned like ci.yml: "latest" asks the GitHub API and fails on its rate limit.
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.119.0
      # Ops 1 part B (master plan 29.9): stamp the commit into the Sentry release tag every function reports.
      - name: Stamp the Sentry release (the commit being deployed)
        run: printf 'export const RELEASE = "%s";\n' "$GITHUB_SHA" > supabase/functions/_shared/release.ts
      - name: Deploy every function (verify_jwt comes from supabase/config.toml)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
      # Clean 1 (master plan 28.9): a function removed from the repository is also removed from Supabase.
      - name: Delete removed functions (supabase/functions-removed.txt)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          grep -v '^#' supabase/functions-removed.txt | while read -r fn; do
            [ -n "$fn" ] || continue
            if [ -d "supabase/functions/$fn" ]; then echo "::error::$fn is listed as removed but its folder exists"; exit 1; fi
            supabase functions delete "$fn" --project-ref "$SUPABASE_PROJECT_REF" --yes || echo "$fn: not deleted (already gone?)"
          done

  worker:
    name: Worker kabsi-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action's default Wrangler (3.90.0) does not read wrangler.jsonc and fails with "Missing entry-point".
          wranglerVersion: "3.114.17"
          workingDirectory: workers/kabsi-go
          command: deploy
