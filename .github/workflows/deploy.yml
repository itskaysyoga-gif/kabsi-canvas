name: Deploy

# D304: a push to main deploys what changed. Secrets (GitHub, Settings, Secrets and variables, Actions):
#   SUPABASE_ACCESS_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Migrations are NOT applied here: earlier migrations were applied by hand with their own version stamps, so a blind
# `db push` would replay them. Apply migrations through the Supabase connector (or add them to history first).

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "workers/kabsi-go/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ynjdqjlmdwjgbfezevxy

jobs:
  functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy every function (verify_jwt comes from supabase/config.toml)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

  worker:
    name: Worker kabsi-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action's default Wrangler (3.90.0) does not read wrangler.jsonc and fails with "Missing entry-point".
          wranglerVersion: "3.114.17"
          workingDirectory: workers/kabsi-go
          command: deploy
