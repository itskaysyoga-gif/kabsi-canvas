name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck, lint, anon JWT guard, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # CI installs from npm like the local setup and Vercel (package-lock.json is gitignored, D265).
      - name: Install
        run: npm install --registry=https://registry.npmjs.org --legacy-peer-deps --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Lint changed files
        run: npm run lint:changed
        env:
          BASE_REF: origin/${{ github.base_ref }}
      - name: Anon JWT guard (D295)
        run: npm run check:anon
      - name: Design tokens (K-108)
        run: npm run check:tokens
      - name: Google calls only in the Google layer (K-34)
        run: npm run check:google
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  functions:
    name: Edge Functions and Worker (deno check, Deno tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deno check and tests
        run: bash scripts/deno-check.sh
      - name: Worker syntax
        run: node --check workers/kabsi-go/src/index.js

  # P0.3-04 (K-39, K-104): a change to a prompt file must pass the evaluation set before it merges. With no prompt
  # change the job passes at once. With one, it runs the 200 cases on the real models only when the repository
  # variable EVAL_LIVE is "true" (and the ANTHROPIC_API_KEY secret is set); otherwise it fails, so the change cannot
  # merge, and nothing is sent to Anthropic. The gate logic itself is tested with stub models in the functions job.
  prompt_gate:
    name: Prompt gate (evaluation set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did a prompt change?
        id: changed
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^supabase/functions/_shared/ai/prompts/'; then
            echo "prompts=true" >> "$GITHUB_OUTPUT"
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep '^supabase/functions/_shared/ai/prompts/'
          else
            echo "No prompt file changed; the evaluation does not need to run."
          fi
      - name: Live evaluation is off
        if: steps.changed.outputs.prompts == 'true' && vars.EVAL_LIVE != 'true'
        run: |
          echo "::error::A prompt changed, so the evaluation set must pass before this merges. Live evaluation is off (repository variable EVAL_LIVE is not true). Nothing was sent to Anthropic."
          exit 1
      - uses: denoland/setup-deno@v2
        if: steps.changed.outputs.prompts == 'true' && vars.EVAL_LIVE == 'true'
        with:
          deno-version: v2.x
      - name: Run the evaluation set (200 cases, real models)
        if: steps.changed.outputs.prompts == 'true' && vars.EVAL_LIVE == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/eval/gate.sh
      - name: Keep the results
        if: always() && steps.changed.outputs.prompts == 'true' && vars.EVAL_LIVE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-result
          path: eval-result.json
          if-no-files-found: ignore

  # P0.6-06 (K-104): Nora's evaluation. The stub run (60 questions against knowledge/kabsi-facts.md: honesty, her rules,
  # prices held to the evaluation) is a test in the app job and always runs. The real model run needs the AI credit: it
  # runs only when the facts file or Nora's rules change AND the repository variable EVAL_LIVE is "true"; otherwise this
  # job says so and passes, and nothing is sent to Anthropic (cost rule 2.12).
  nora_gate:
    name: Nora gate (60 questions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Did Nora's facts or rules change?
        id: changed
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^(knowledge/kabsi-facts\.md|supabase/functions/_shared/nora-rules\.ts|supabase/functions/assistant/|scripts/nora-eval/)'; then
            echo "nora=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nora's facts and rules did not change."
          fi
      - name: The stub run
        run: node scripts/nora-eval/run-nora-eval.ts --stub pass
      - name: The live run is off
        if: steps.changed.outputs.nora == 'true' && vars.EVAL_LIVE != 'true'
        run: echo "::notice::Nora's facts or rules changed. The live run waits for ANTHROPIC_API_KEY and EVAL_LIVE, which R-45 keeps false; only the stub run was made. Nothing was sent to Anthropic."
      - name: The live run
        if: steps.changed.outputs.nora == 'true' && vars.EVAL_LIVE == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/nora-eval/run-nora-eval.ts --live --out nora-eval-result.json
      - name: Keep the results
        if: always() && steps.changed.outputs.nora == 'true' && vars.EVAL_LIVE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nora-eval-result
          path: nora-eval-result.json
          if-no-files-found: ignore

  # Ops 1 part A (R-66, master plan 19.4): gitleaks looks for secrets in the commits of this pull request only
  # (base to head), so old history cannot turn CI red. The release is pinned and its checksum is checked. Findings are
  # printed redacted (file, line, rule, commit) and never as values. False positives go in .gitleaks.toml with a reason.
  gitleaks:
    name: Secret scan (gitleaks, this pull request's commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.0 (checksum checked)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      - name: Scan the pull request's commits
        run: |
          ./gitleaks git --redact=100 --no-banner --verbose --config .gitleaks.toml \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  database:
    name: Database (pgTAP on a local Supabase stack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Pinned: "latest" asks the GitHub API and fails on its rate limit.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Migrations and pgTAP suite (K-54, P0.1-07)
        run: bash scripts/db-test.sh
