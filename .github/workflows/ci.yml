name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck, lint, anon JWT guard, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Ops 1 part B (master plan 25.1): package-lock.json is committed; CI and Vercel install exactly what it names.
      - name: Install
        run: npm ci --registry=https://registry.npmjs.org --legacy-peer-deps --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Lint changed files
        run: npm run lint:changed
        env:
          BASE_REF: origin/${{ github.base_ref }}
      - name: Anon JWT guard (D295)
        run: npm run check:anon
      - name: Design tokens (K-108)
        run: npm run check:tokens
      - name: Google calls only in the Google layer (K-34)
        run: npm run check:google
      # Ops 1 part B (master plan 26.6, 25.1): migration names, SKILL.md frontmatter, actions pinned to a full SHA, lockfile.
      - name: Repo checks
        run: npm run check:repo
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  functions:
    name: Edge Functions and Worker (deno check, Deno tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Deno check and tests
        run: bash scripts/deno-check.sh
      - name: Worker syntax
        run: node --check workers/kabsi-go/src/index.js

  # P0.3-04 (K-39, K-104): a change to a prompt file must pass the evaluation set before it merges. With no prompt
  # change the job passes at once. With one, it runs the 200 cases on the real models only when the repository
  # variable EVAL_LIVE is "true" (and the ANTHROPIC_API_KEY secret is set); otherwise it fails, so the change cannot
  # merge, and nothing is sent to Anthropic. The gate logic itself is tested with stub models in the functions job.
  prompt_gate:
    name: Prompt gate (evaluation set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Did a prompt change?
        id: changed
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^supabase/functions/_shared/ai/prompts/'; then
            echo "prompts=true" >> "$GITHUB_OUTPUT"
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep '^supabase/functions/_shared/ai/prompts/'
          else
            echo "No prompt file changed; the evaluation does not need to run."
          fi
      - name: Live evaluation is off
        if: steps.changed.outputs.prompts == 'true' && vars.EVAL_LIVE != 'true'
        run: |
          echo "::error::A prompt changed, so the evaluation set must pass before this merges. Live evaluation is off (repository variable EVAL_LIVE is not true). Nothing was sent to Anthropic."
          exit 1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: steps.changed.outputs.prompts == 'true' && vars.EVAL_LIVE == 'true'
        with:
          deno-version: v2.x
      - name: Run the evaluation set (200 cases, real models)
        if: steps.changed.outputs.prompts == 'true' && vars.EVAL_LIVE == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/eval/gate.sh
      - name: Keep the results
        if: always() && steps.changed.outputs.prompts == 'true' && vars.EVAL_LIVE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-result
          path: eval-result.json
          if-no-files-found: ignore

  # P0.6-06 (K-104): Nora's evaluation. The stub run (60 questions against knowledge/kabsi-facts.md: honesty, her rules,
  # prices held to the evaluation) is a test in the app job and always runs. The real model run needs the AI credit: it
  # runs only when the facts file or Nora's rules change AND the repository variable EVAL_LIVE is "true"; otherwise this
  # job says so and passes, and nothing is sent to Anthropic (cost rule 2.12).
  nora_gate:
    name: Nora gate (60 questions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Did Nora's facts or rules change?
        id: changed
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^(knowledge/(kabsi-facts\.md|facts/)|scripts/kb-lib\.mjs|supabase/functions/_shared/nora-rules\.ts|supabase/functions/assistant/|scripts/nora-eval/)'; then
            echo "nora=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nora's facts and rules did not change."
          fi
      - name: The stub run
        run: node scripts/nora-eval/run-nora-eval.ts --stub pass
      - name: The live run is off
        if: steps.changed.outputs.nora == 'true' && vars.EVAL_LIVE != 'true'
        run: echo "::notice::Nora's facts or rules changed. The live run waits for ANTHROPIC_API_KEY and EVAL_LIVE, which R-45 keeps false; only the stub run was made. Nothing was sent to Anthropic."
      - name: The live run
        if: steps.changed.outputs.nora == 'true' && vars.EVAL_LIVE == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/nora-eval/run-nora-eval.ts --live --out nora-eval-result.json
      - name: Keep the results
        if: always() && steps.changed.outputs.nora == 'true' && vars.EVAL_LIVE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nora-eval-result
          path: nora-eval-result.json
          if-no-files-found: ignore

  # Ops 1 part A (R-66, master plan 19.4): gitleaks looks for secrets in the commits of this pull request only
  # (base to head), so old history cannot turn CI red. The release is pinned and its checksum is checked. Findings are
  # printed redacted (file, line, rule, commit) and never as values. False positives go in .gitleaks.toml with a reason.
  gitleaks:
    name: Secret scan (gitleaks, this pull request's commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.0 (checksum checked)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      - name: Scan the pull request's commits
        run: |
          ./gitleaks git --redact=100 --no-banner --verbose --config .gitleaks.toml \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  database:
    name: Database (pgTAP on a local Supabase stack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pinned: "latest" asks the GitHub API and fails on its rate limit.
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.119.0
      # Sec 1: the approval property tests (supabase/tests/sec1_approval_properties.ts) run with Deno after pgTAP.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Migrations and pgTAP suite (K-54, P0.1-07)
        run: bash scripts/db-test.sh

  # Ops 1 part B (master plan 26.6): a pull request that adds or upgrades a package with a known vulnerability, or a
  # licence Kabsi cannot ship, fails here. Needs the dependency graph (Settings, Code security).
  dependency_review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  # Lean 1 (1 Nov 2026, master plan 24.9): the speed gate. Home at 390 px on a throttled phone, 3 runs, median. Copy 3 (5 Nov
  # 2026, master plan 30.29 item 2 and 30.30 item 5): Pricing and /scan are measured the same way, each with its own script
  # budget (LH_PAGES). It FAILS the pull request when LCP is over its limit or the script a page downloads is over its
  # budget. Claude branches have no
  # Vercel preview (vercel.json switches them off), so the pull request is measured on its own production build behind
  # scripts/serve-compressed.mjs, which serves like Vercel (HTTP/2 over a throwaway certificate, brotli quality 4, the long
  # cache header on hashed files; over plain HTTP/1.1 the same build read 2.7 s instead of 2.1 s);
  # lighthouse-live.yml runs the same gate on kabsi.co after each production deploy. LH_JS_KB is the number Home is at,
  # ratcheted down by the pull request that earns it: the Lean 1 target is 150 KB, master plan 24.9 says 120 KB (see
  # docs/progress/archive/2026-11-01-lean1.md for what stands in the way).
  speed:
    name: Speed gate (Home, Pricing and /scan at 390 px)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Script size is exact, so it is gated tight. LCP is not: on a two-core runner Chrome shares the processor with the
      # server, and the same build reads 2.1 s on a quiet machine and 2.6 s here. So the pull request guards LCP against a
      # regression only (3.0 s); the real 2.5 s gate is lighthouse-live.yml, against kabsi.co, after each Production deploy.
      LH_LCP_MS: "3000"
      # Polish 1 (1 Nov 2026): 203 KB measured by this gate on the pull request build, plus 10 (was 260). Lane R target: 200.
      # R-106 (4 Nov 2026, master plan 30.26): lowered to 205 to keep Polish 4's gain (the pull request build read 199 KB).
      # Copy 3 (master plan 30.29 item 2): Pricing 215 and /scan 235 KB in CI, so neither grows (the live budgets, 225 and
      # 245 KB, are in lighthouse-live.yml).
      LH_PAGES: "/=205,/pricing=215,/scan=235"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install
        run: npm ci --registry=https://registry.npmjs.org --legacy-peer-deps --no-audit --no-fund
      - name: Build and serve (HTTP/2 and compressed, like Vercel)
        run: |
          npm run build
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" -subj /CN=localhost -days 1 2> /dev/null
          PORT=4173 node .output/server/index.mjs > serve.log 2>&1 &
          TLS_KEY="$RUNNER_TEMP/key.pem" TLS_CERT="$RUNNER_TEMP/cert.pem" node scripts/serve-compressed.mjs 4174 4173 > front.log 2>&1 &
          for i in $(seq 1 30); do curl -skf https://localhost:4174/ > /dev/null && break; sleep 1; done
      - name: Lighthouse on Home, Pricing and /scan (3 runs each, 390 px)
        run: npx --yes @lhci/cli@0.15.1 collect --config=lighthouserc.speed.json
      - name: Gate
        run: node scripts/lighthouse-gate.mjs .lighthouseci
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: speed-gate-report
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore

  # Ops 1 part B (master plan 24.9): Lighthouse CI on a throttled phone for every public page. REPORT ONLY: the job never
  # fails the pull request, and every assertion in lighthouserc.json is a "warn". Lean 1: it now reads the build through
  # scripts/serve-compressed.mjs (the plain Node server sent everything uncompressed and read about three times heavier
  # than kabsi.co); the blocking check for Home is the `speed` job above.
  lighthouse:
    name: Lighthouse CI (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install
        run: npm ci --registry=https://registry.npmjs.org --legacy-peer-deps --no-audit --no-fund
      - name: Build and serve (HTTP/2 and compressed, like Vercel)
        run: |
          npm run build
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" -subj /CN=localhost -days 1 2> /dev/null
          PORT=4173 node .output/server/index.mjs > serve.log 2>&1 &
          TLS_KEY="$RUNNER_TEMP/key.pem" TLS_CERT="$RUNNER_TEMP/cert.pem" node scripts/serve-compressed.mjs 4174 4173 > front.log 2>&1 &
          for i in $(seq 1 30); do curl -skf https://localhost:4174/ > /dev/null && break; sleep 1; done
      - name: Lighthouse (3 runs per page)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
      - name: Summary
        if: always()
        run: node scripts/lighthouse-summary.mjs
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-report
          path: .lighthouseci-report
          include-hidden-files: true
          if-no-files-found: ignore
