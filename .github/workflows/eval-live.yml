name: Eval live (by hand, 27.9)

# Session 19 rest (master plan 27.9 and 26.1): the live evaluation on the promotional credit, run by hand only (Actions,
# "Eval live", Run workflow). EVAL_LIVE stays false, so CI never runs it. Two parts, each stopped at its own budget so
# the whole run stays under 8 US dollars:
#   1. replies: 50 everyday cases plus every safety, injection and contradiction case (160), through the production
#      steps, each ready draft scored by the judge;
#   2. Nora: her 60 questions plus the 20 of 28.7, each answer scored by the judge.
# The results and the judge's scores per prompt version are kept as artifacts. Needs the secret ANTHROPIC_API_KEY.
# Eval 1: two switches. "evaluations" runs parts 1 and 2 (on by default); "injection" also runs the Sec 1 hostile text
# cases (scripts/sec1/injection-live.ts: at most 30 cases, stopped at its own budget, 0.30 US dollars by default).
# Launch 1 (master plan 30.35 item 6): "pages_only" runs only Nora's five page-link questions with the real Nora, one at a
# time, stopped at pages_budget (0.40 US dollars), with no reply evaluation, no judge and no injection cases.
on:
  workflow_dispatch:
    inputs:
      reply_budget:
        description: Budget for the reply part, US dollars
        required: true
        default: "5"
      nora_budget:
        description: Budget for Nora's part, US dollars
        required: true
        default: "2.5"
      evaluations:
        description: Run the reply and Nora evaluations
        type: boolean
        default: true
      reply_languages:
        description: "Fix 1: only the reviews in these languages, for example ar,fr,es,arabizi (empty: the whole cut)"
        required: false
        default: ""
      nora_ids:
        description: "Fix 1: only these Nora questions, for example en16,sc03 (empty: all 83)"
        required: false
        default: ""
      injection:
        description: Run the Sec 1 injection cases (at most 30 cases)
        type: boolean
        default: false
      injection_budget:
        description: Budget for the injection cases, US dollars
        required: true
        default: "0.30"
      pages_only:
        description: "Launch 1: only Nora's five page-link questions (no replies, no judge, no injection)"
        type: boolean
        default: false
      pages_budget:
        description: Budget for the page-link questions, US dollars (at most 0.40)
        required: true
        default: "0.40"

permissions:
  contents: read

jobs:
  live:
    name: Live evaluation (real models)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Replies (the 27.9 cut, judged)
        if: inputs.evaluations && !inputs.pages_only
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPLY_BUDGET: ${{ inputs.reply_budget }}
          REPLY_LANGUAGES: ${{ inputs.reply_languages }}
        run: bash scripts/eval/gate.sh --cut --judge --budget "$REPLY_BUDGET" --scores "$GITHUB_WORKSPACE/scripts/eval/scores.json" ${REPLY_LANGUAGES:+--languages "$REPLY_LANGUAGES"}
        continue-on-error: true
      - name: Nora (80 questions, judged)
        if: inputs.evaluations && !inputs.pages_only
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NORA_BUDGET: ${{ inputs.nora_budget }}
          NORA_IDS: ${{ inputs.nora_ids }}
        run: node scripts/nora-eval/run-nora-eval.ts --live --with-28 --judge --budget "$NORA_BUDGET" --out nora-eval-result.json --scores scripts/eval/scores.json ${NORA_IDS:+--ids "$NORA_IDS"}
        continue-on-error: true
      - name: Nora's page-link questions (Launch 1, real Nora, no judge)
        if: inputs.pages_only
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAGES_BUDGET: ${{ inputs.pages_budget }}
        run: |
          # 30.35 item 6: never above 0.40 US dollars, whatever the input says.
          budget="$(node -e 'const b = Number(process.argv[1]); console.log(b > 0 && b <= 0.4 ? b : 0.4)' "$PAGES_BUDGET")"
          node scripts/nora-eval/run-nora-eval.ts --live --pages --concurrency 1 --budget "$budget" --out nora-pages-result.json
        continue-on-error: true
      - name: Injection cases (Sec 1, real models)
        if: inputs.injection && !inputs.pages_only
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INJECTION_BUDGET: ${{ inputs.injection_budget }}
        run: |
          scratch="$(mktemp -d)"
          mkdir -p "$scratch/supabase/functions" "$scratch/scripts/sec1" "$scratch/knowledge"
          cp -r supabase/functions/. "$scratch/supabase/functions/"
          cp scripts/sec1/injection-live.ts "$scratch/scripts/sec1/"
          cp knowledge/kabsi-facts.md "$scratch/knowledge/"
          echo '{"nodeModulesDir":"auto"}' > "$scratch/deno.json"
          cd "$scratch"
          deno run --allow-env --allow-read --allow-net scripts/sec1/injection-live.ts --budget "$INJECTION_BUDGET" | tee "$GITHUB_WORKSPACE/injection-live.txt"
        continue-on-error: true
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-live-result
          path: |
            eval-result.json
            nora-eval-result.json
            nora-pages-result.json
            injection-live.txt
            scripts/eval/scores.json
          if-no-files-found: ignore
