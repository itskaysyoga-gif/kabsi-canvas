name: Lighthouse live

# Lean 1 (30 Oct plan, speed): Lighthouse on a throttled phone (mobile, 3 runs, median) against the real site, by hand.
# Run it from the Actions tab (Run workflow) before and after a speed change. It never touches the site and never fails a
# pull request; the numbers land in the job summary and in the uploaded report.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to measure"
        default: "https://kabsi.co"
        required: true
      pages:
        description: "Paths, space separated"
        default: "/ /pricing /scan /founding /for/hair-salon"
        required: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse (mobile, 3 runs, median)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Lighthouse (3 runs per page)
        env:
          BASE_URL: ${{ inputs.base_url }}
          PAGES: ${{ inputs.pages }}
        run: |
          args=""
          for p in $PAGES; do args="$args --url=${BASE_URL%/}${p}"; done
          npx --yes @lhci/cli@0.15.1 collect $args --numberOfRuns=3 --settings.formFactor=mobile "--settings.chromeFlags=--no-sandbox --headless=new"
      - name: Summary
        if: always()
        run: node scripts/lighthouse-summary.mjs .lighthouseci
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-live-report
          path: .lighthouseci
          if-no-files-found: ignore
