name: Lighthouse live

# Lean 1 (30 Oct plan, speed): Lighthouse on a throttled phone (mobile, 3 runs, median) against the real site.
# By hand (Actions tab, Run workflow): five pages, before and after a speed change; the numbers land in the job summary
# and the uploaded report. After every Production deploy (Vercel's deployment_status): Home at 390 px against kabsi.co,
# and that run FAILS when Home, Pricing or /scan misses the speed gate (scripts/lighthouse-gate.mjs; the same pages as the
# `speed` job of ci.yml, with the live budgets of master plan 30.29 item 2). A by-hand run never fails. It never touches
# the site and never fails a pull request.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to measure"
        default: "https://kabsi.co"
        required: true
      pages:
        description: "Paths, space separated"
        default: "/ /pricing /scan /founding /for/hair-salon"
        required: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse (mobile, 3 runs, median)
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Lighthouse's simulated LCP for Home went from 2.0 s to 2.6 s on 1 Nov 2026 while the LCP measured with real
      # DevTools throttling stayed at 1.85 s (docs/progress/archive/2026-11-01-lean1.md). Until the cause of the simulated
      # rise is found (docs/LATER.md) this is a ratchet at 3.0 s; the target stays 2.5 s.
      LH_LCP_MS: "3000"
      # Polish 1 (1 Nov 2026): kabsi.co read 215 KB on this gate after the change (237 before), plus 10 (was 260). The pull
      # request build reads lower (203 KB, local compression); see docs/progress/archive/2026-11-01-polish1.md.
      # R-106 (4 Nov 2026, master plan 30.26): lowered to 215 to keep Polish 4's gain (kabsi.co read 208 KB, run 41811248799).
      # Copy 3 (master plan 30.29 item 2): the gate also reads Pricing and /scan, each with its own live budget.
      LH_PAGES: "/=215,/pricing=225,/scan=245"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Lighthouse (3 runs per page)
        env:
          BASE_URL: ${{ inputs.base_url || 'https://kabsi.co' }}
          PAGES: ${{ inputs.pages || '/ /pricing /scan' }}
          EVENT: ${{ github.event_name }}
        run: |
          set -f
          args=""
          for p in $PAGES; do args="$args --url=${BASE_URL%/}${p}"; done
          # After a deploy: Home at 390 px (the speed gate's own setup). By hand: Lighthouse's default phone, so the numbers
          # stay comparable with the "before" table of docs/progress/archive/2026-11-01-lean1.md.
          if [ "$EVENT" = "deployment_status" ]; then
            npx --yes @lhci/cli@0.15.1 collect --config=lighthouserc.speed.json $args
          else
            npx --yes @lhci/cli@0.15.1 collect $args --numberOfRuns=3 --settings.formFactor=mobile "--settings.chromeFlags=--no-sandbox --headless=new"
          fi
      - name: Summary
        if: always()
        run: node scripts/lighthouse-summary.mjs .lighthouseci
      - name: Gate (Home, Pricing and /scan, after a deploy only)
        if: github.event_name == 'deployment_status'
        run: node scripts/lighthouse-gate.mjs .lighthouseci
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-live-report
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore
