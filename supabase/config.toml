# Per-function JWT settings (D295). A redeploy without this file defaults verify_jwt to true.
# false = the caller cannot send a Supabase JWT, and the function checks its own credential in code
# (Worker secret, a webhook signature, or a public asset). true = the gateway requires a JWT; pg_cron and pg_net
# calls (call_internal) and browser calls send the anon or user JWT, and the functions still check
# x-cron-secret, the user or a rate limit in code.
project_id = "ynjdqjlmdwjgbfezevxy"

# No JWT.
[functions.tap]              # called by the go.kabsi.co Worker with x-kabsi-secret
verify_jwt = false
[functions.brand]            # public mark.png used by emails
verify_jwt = false
[functions.health]           # x-cron-secret
verify_jwt = false
[functions.google-capture]   # x-cron-secret; read-only Google capture (P0.7-01)
verify_jwt = false
[functions.email]            # one-click unsubscribe (signed link) and the Resend webhook (Svix signature); /test needs x-cron-secret (P0.4-08)
verify_jwt = false
[functions.google-events]    # Pub/Sub push (P0.7-03): Google's OIDC token for Kabsi's push service account, checked in code
verify_jwt = false
[functions.billing-creem]    # Creem's webhook signs with creem-signature and sends no JWT; /setup needs x-cron-secret or staff, /owner a signed-in owner, checked in code (session 10)
verify_jwt = false
[functions.programs]         # Founding 25 and Kabsi Partners applications and counts (Partners session): public, Turnstile and rate limits in code, service-role-only database functions
verify_jwt = false

# JWT required.
[functions.api]
verify_jwt = true
[functions.assistant]
verify_jwt = true
[functions.content]
verify_jwt = true
[functions.kv-sync]
verify_jwt = true
[functions.places-search]
verify_jwt = true
[functions.review-link]
verify_jwt = true
[functions.review-graphic]  # Pro review graphic (P0.8-07): the signed-in owner or manager calls it; membership, the Pro check and the rating check run in code
verify_jwt = true
[functions.review-cards]     # print-ready counter card and table tent PDFs (V3): the signed-in member of the business calls it; membership and the rate limit run in code
verify_jwt = true
[functions.insights]       # Insights (P0.5-05): the signed-in owner or manager calls it; membership, the rate limit and the Pro check for search terms run in code
verify_jwt = true
[functions.coach]          # Profile Coach actions (P0.8-09 part B): the signed-in owner or manager calls it; membership, the Pro check, the rate limits and the website safety checks run in code
verify_jwt = true
[functions.review-page]      # the page behind a review link (P0.8-05): browser calls send the anon JWT; rate limit and the active-link check run in code
verify_jwt = true
[functions.auth-code]         # sign-in code (P0.4-02): browser calls send the anon JWT; Turnstile, the code limits and the throwaway-domain check run in code
verify_jwt = true
[functions.consent]           # privacy banner proof (P0.6-01): browser calls send the anon JWT or the session; validation and a rate limit run in code
verify_jwt = true
[functions.photos]            # photo engine (P0.5-01): process needs x-cron-secret (the job sends the anon JWT with it); the staff upload page sends the anon JWT; the link token, size and rate limits run in code
verify_jwt = true
[functions.profile-snapshot]  # public free check (P0.4-01): browser calls send the anon JWT; Turnstile, rate limits and the Places guard run in code
verify_jwt = true

# 29 Sep: api, assistant, lead and review-link stay true. Browser calls without a session send the public anon JWT
# (src/lib/supabase.ts anonHeaders), so no function has to skip verification for them. Only callers that cannot send
# a JWT at all (tap from the Worker, health, brand) are false. The slack function was removed in session 13b part 2.

# Local stack only (P0.1-07, scripts/db-test.sh): the database test job runs the same Postgres major version as
# production. `supabase functions deploy` does not read this section.
[db]
major_version = 17
[functions.whatsapp]          # WhatsApp owner channel (P0.8-03): Kapso calls it without a JWT; the Kapso signature over the raw body, Kabsi's phone number id, the replay window and the opt-in run in code
verify_jwt = false
[functions.visibility]        # Visibility Map (V1): /tick needs x-cron-secret (pg_cron sends the anon JWT with it); /keyword, /picks and /image check the member or staff in code; V4 /check and /terms are public (anon JWT, Turnstile, rate limits and the daily cap in code)
verify_jwt = true
