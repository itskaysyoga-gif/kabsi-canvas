# Per-function JWT settings (D295). A redeploy without this file defaults verify_jwt to true, which made
# pg_cron, pg_net and Worker calls (no user JWT) return 401 for 24 hours.
# false = the function checks its own credential in code (x-cron-secret, x-kabsi-secret, Slack signature,
# action token, or rate-limited public access). true = a signed-in user's JWT is required.
project_id = "ynjdqjlmdwjgbfezevxy"

# Requested list (D295): no JWT.
[functions.tap]
verify_jwt = false
[functions.brand]
verify_jwt = false
[functions.health]
verify_jwt = false
[functions.site-assets]
verify_jwt = false

# Also no JWT, because their callers send none. Each one authenticates in code.
[functions.kv-sync]          # DB trigger and backfill via call_internal (x-cron-secret)
verify_jwt = false
[functions.posts-weekly]     # pg_cron via call_internal (x-cron-secret)
verify_jwt = false
[functions.slack]            # pg_cron flush, Slack-signed /interact and /command, Sentry poll
verify_jwt = false
[functions.api]              # cron-tick (x-cron-secret) and email links (action token); approve checks the user in code
verify_jwt = false
[functions.assistant]        # public chat widget, plus the internal /report route
verify_jwt = false
[functions.partner]          # user routes check the JWT in code; /billing is cron only
verify_jwt = false
[functions.lead]             # public form, rate-limited and honeypot
verify_jwt = false
[functions.review-link]      # public free tool, rate-limited
verify_jwt = false
[functions.places-search]    # public onboarding search, rate-limited fail-closed
verify_jwt = false

# JWT required.
[functions.content]          # signed-in members only (currentUser in code as well)
verify_jwt = true
[functions.cron-tick]        # retired 410 stub
verify_jwt = true
