# Kabsi Slack app (D263). Create it at https://api.slack.com/apps → Create New App → From a manifest →
# workspace "itskabsi" → paste this → Create → Install to Workspace.
# Then in Supabase (Project → Edge Functions → Secrets) add, never in chat:
#   SLACK_BOT_TOKEN       = "Bot User OAuth Token" (starts with xoxb-) from OAuth & Permissions
#   SLACK_SIGNING_SECRET  = "Signing Secret" from Basic Information → App Credentials
display_information:
  name: Kabsi
  description: Kabsi operations alerts, daily summary and /kabsi lookups.
  background_color: "#0B0B0B"
features:
  bot_user:
    display_name: Kabsi
    always_online: true
  slash_commands:
    - command: /kabsi
      url: https://ynjdqjlmdwjgbfezevxy.supabase.co/functions/v1/slack/command
      description: Today's numbers, what's pending, or find a business, contact or partner
      usage_hint: "[today | week | pending | find <name or email> | help]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - channels:join
      - commands
settings:
  interactivity:
    is_enabled: true
    request_url: https://ynjdqjlmdwjgbfezevxy.supabase.co/functions/v1/slack/interact
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
